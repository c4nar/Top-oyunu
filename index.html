<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top Savaşı</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>window.Peer||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"><\/script>')</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#12141c;color:#eee;font-family:system-ui,sans-serif;text-align:center}
.s{display:none;padding:20px;max-width:640px;margin:auto}.s.on{display:block}
input,select,button{font-size:18px;padding:10px 14px;margin:6px;border-radius:8px;border:0}
input,select{background:#272b3a;color:#fff}button{background:#4d7cff;color:#fff;cursor:pointer}button.g{background:#444}
#on{position:fixed;top:8px;left:10px;font-size:14px;background:#0008;padding:4px 10px;border-radius:8px}
canvas{background:#1d2030;border:3px solid #4d7cff;max-width:100%;touch-action:none}
#prev{width:90px;height:90px;border-radius:50%;cursor:pointer;border:3px solid #fff;margin:10px}
.big{font-size:56px;margin:30px 0}.err{color:#f66}
</style></head><body>
<div id="on">Çevrimiçi: 1</div>

<div id="auth" class="s on"><h1>⚔️ Top Savaşı</h1>
<input id="u" placeholder="Kullanıcı adı"><br><input id="p" type="password" placeholder="Şifre"><br>
<button onclick="reg()">Kayıt Ol</button><button onclick="login()">Giriş Yap</button><p id="e" class="err"></p></div>

<div id="menu" class="s"><h2 id="hi"></h2><p id="st"></p>
<button onclick="go('wait');match()">▶ Başlat</button><br>
<button onclick="go('cust')">🎨 Karakter Özelleştirme</button><br>
<button class="g" onclick="out()">Çıkış</button></div>

<div id="cust" class="s"><h2>Karakter</h2>
<canvas id="prev0" width="0" height="0" hidden></canvas>
<img id="prev" alt="" title="Resim eklemek için tıkla"><br>
<small>Topa tıkla: PNG/JPEG yükle</small><input id="f" type="file" accept="image/png,image/jpeg" hidden><br>
<input id="nm" placeholder="Top ismi" maxlength="14"><br>
<select id="wp"><option value="sword">🗡️ Kılıç (az hasar, kısa bekleme)</option><option value="axe">🪓 Balta (çok hasar, uzun bekleme)</option><option value="bow">🏹 Yay (her sn ok)</option></select><br>
Renk: <input id="cl" type="color" value="#4d7cff"><br>
<button onclick="remImg()" class="g">Resmi kaldır</button><button onclick="saveC()">Kaydet</button></div>

<div id="wait" class="s"><div class="big" id="cnt">1/2</div><h2 id="wm">Rakip aranıyor...</h2>
<button class="g" onclick="cancel()">İptal</button></div>

<div id="game" class="s"><div id="info"></div><canvas id="cv" width="600" height="600"></canvas>
<div id="res" class="big"></div></div>

<script>
const $=i=>document.getElementById(i),S=1e3;let me=null,prof=null;
const U=()=>JSON.parse(localStorage.cbkU||'{}'),sU=o=>localStorage.cbkU=JSON.stringify(o);
function go(i){document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id==i))}
async function H(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function reg(){const n=$('u').value.trim(),p=$('p').value;if(n.length<3||p.length<4)return $('e').textContent='Ad en az 3, şifre en az 4 karakter';
 const u=U();if(u[n])return $('e').textContent='Bu kullanıcı adı alınmış';
 u[n]={h:await H(p),w:0,l:0,g:0,c:{name:n,w:'sword',c:'#4d7cff',img:null}};sU(u);enter(n)}
async function login(){const n=$('u').value.trim(),u=U();if(!u[n]||u[n].h!=await H($('p').value))return $('e').textContent='Hatalı kullanıcı adı veya şifre';enter(n)}
function enter(n){me=n;localStorage.cbkMe=n;$('e').textContent='';menu()}
function out(){me=null;delete localStorage.cbkMe;go('auth')}
function menu(){const d=U()[me];prof=d.c;$('hi').textContent='Merhaba, '+me;
 $('st').textContent=`Oyun: ${d.g} | Galibiyet: ${d.w} | Mağlubiyet: ${d.l}`;go('menu')}
function upd(f){const u=U();f(u[me]);sU(u)}
// karakter
const pv=$('prev'),W={sword:{n:'Kılıç',cd:.5,d:20,i:'🗡️'},axe:{n:'Balta',cd:1.5,d:60,i:'🪓'},bow:{n:'Yay',cd:1,d:15,i:'🏹'}};
function showC(){$('nm').value=prof.name;$('wp').value=prof.w;$('cl').value=prof.c;pv.src=prof.img||ball(prof.c)}
function ball(c){const k=document.createElement('canvas');k.width=k.height=64;const x=k.getContext('2d');x.fillStyle=c;x.beginPath();x.arc(32,32,32,0,7);x.fill();return k.toDataURL()}
document.querySelector('[onclick="go(\'cust\')"]').addEventListener('click',showC);
pv.onclick=()=>$('f').click();$('cl').oninput=()=>{if(!prof.img)pv.src=ball($('cl').value)};
$('f').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=document.createElement('canvas');k.width=k.height=64;
 const m=Math.min(im.width,im.height);k.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,64,64);prof.img=pv.src=k.toDataURL('image/jpeg',.8)};im.src=r.result};r.readAsDataURL(f)};
function remImg(){prof.img=null;pv.src=ball($('cl').value)}
function saveC(){prof={name:$('nm').value.trim()||me,w:$('wp').value,c:$('cl').value,img:prof.img};upd(d=>d.c=prof);menu()}
// eşleşme
let peer,conn,host=false,tm,G=null;
function match(){host=false;$('cnt').textContent='1/2';$('wm').textContent='Rakip aranıyor...';$('on').textContent='Çevrimiçi: 1';
 if(typeof Peer=='undefined'){host=true;G={o:{name:'Bot',w:['sword','axe','bow'][Math.random()*3|0],c:'#e55',img:null},bot:1};$('wm').textContent='Bağlantı kurulamadı, bot ile eşleştin';found(()=>startHost());return}
 peer=new Peer('cbkball-lobby-0');
 peer.on('open',()=>{host=true;peer.on('connection',c=>{conn=c;c.on('data',m=>{if(m.t=='hi'&&!G){clearTimeout(tm);G={o:m.p};c.send({t:'hi',p:prof});found(()=>startHost())}})});
  tm=setTimeout(()=>{if(!G){G={o:{name:'Bot',w:['sword','axe','bow'][Math.random()*3|0],c:'#e55',img:null},bot:1};$('wm').textContent='Aktif oyuncu bulunamadı, bot ile eşleştin';found(()=>startHost())}},12000)});
 peer.on('error',e=>{if(e.type!='unavailable-id')return;host=false;peer.destroy();peer=new Peer();
  peer.on('open',()=>{conn=peer.connect('cbkball-lobby-0');tm=setTimeout(()=>{conn.close();peer.destroy();match()},5000);
   conn.on('open',()=>{clearTimeout(tm);conn.send({t:'hi',p:prof})});
   conn.on('data',m=>{if(m.t=='hi'){G={o:m.p};found(()=>startGuest())}else if(m.t=='s')gs=m.s});
   conn.on('close',()=>{if(G&&!G.done)end(0,1)})})})}
function found(cb){$('cnt').textContent='2/2';$('wm').textContent='BİRİYLE EŞLEŞTİN';$('on').textContent='Çevrimiçi: 2';setTimeout(cb,1800)}
function cancel(){clearTimeout(tm);if(peer)peer.destroy();G=null;menu()}
// oyun
const cv=$('cv'),x=cv.getContext('2d'),R=24,A=600,ims={};let gs=null,raf,aim=null,last;
function im(p,k){if(!p.img)return null;return ims[k]||(ims[k]=Object.assign(new Image(),{src:p.img}))}
function mk(p,px,py){return{x:px,y:py,vx:0,vy:0,hp:500,cd:0,rl:0,p}}
function startHost(){G.me=mk(prof,100,300);G.op=mk(G.o,500,300);G.ar=[];G.t=6;G.ph='aim';G.dir=null;
 if(G.bot){const a=Math.random()*6.28;G.odir=a}
 if(conn)conn.on('data',m=>{if(m.t=='a')G.odir=m.a});begin()}
function startGuest(){begin()}
function begin(){go('game');$('res').textContent='';G.done=0;gs=gs||null;last=performance.now();aim=null;cancelAnimationFrame(raf);
 $('info').textContent='Yönünü seçmek için kutuya tıkla!';raf=requestAnimationFrame(loop)}
cv.onclick=e=>{if(!G||(host?G.ph:gs&&gs.ph)!='aim')return;const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*A/r.width,my=(e.clientY-r.top)*A/r.height;
 const b=host?G.me:null,px=host?b.x:500,py=host?b.y:300;aim=Math.atan2(my-py,mx-px);if(host)G.dir=aim;else conn.send({t:'a',a:aim})};
function loop(n){const dt=Math.min((n-last)/S,.05);last=n;
 if(host){sim(dt);if(conn&&!G.bot)conn.send({t:'s',s:pack()});draw(pack())}else if(gs)draw(gs);
 const s=host?pack():gs;if(s&&s.o!=null){fin(s.o);return}raf=requestAnimationFrame(loop)}
function pack(){const q=p=>({x:p.x,y:p.y,hp:p.hp,cd:p.cd,rl:p.rl});return{a:q(G.me),b:q(G.op),ar:G.ar.map(a=>[a.x,a.y]),ph:G.ph,t:G.t,o:G.w}}
function sim(dt){const m=G.me,o=G.op;
 if(G.ph=='aim'){G.t-=dt;if(G.t<=0){G.ph='run';const sp=230;
  const da=G.dir??Math.atan2(o.y-m.y,o.x-m.x),db=G.odir??Math.atan2(m.y-o.y,m.x-o.x);
  m.vx=Math.cos(da)*sp;m.vy=Math.sin(da)*sp;o.vx=Math.cos(db)*sp;o.vy=Math.sin(db)*sp}return}
 for(const p of[m,o]){p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(p.x<R){p.x=R;p.vx=Math.abs(p.vx)}if(p.x>A-R){p.x=A-R;p.vx=-Math.abs(p.vx)}
  if(p.y<R){p.y=R;p.vy=Math.abs(p.vy)}if(p.y>A-R){p.y=A-R;p.vy=-Math.abs(p.vy)}
  p.cd=Math.max(0,p.cd-dt)}
 let dx=o.x-m.x,dy=o.y-m.y,d=Math.hypot(dx,dy)||1;
 if(d<2*R){const nx=dx/d,ny=dy/d;
  for(const[p,q]of[[m,o],[o,m]]){const w=W[p.p.w];if(w.d&&p.p.w!='bow'&&p.cd<=0){q.hp-=w.d;p.cd=w.cd;if(p.p.w=='bow'){}}}
  const t=m.vx;m.vx=o.vx;o.vx=t;const u=m.vy;m.vy=o.vy;o.vy=u;
  m.x-=nx*(2*R-d)/2;m.y-=ny*(2*R-d)/2;o.x+=nx*(2*R-d)/2;o.y+=ny*(2*R-d)/2}
 for(const[p,q]of[[m,o],[o,m]])if(p.p.w=='bow'){p.rl+=dt;if(p.rl>=1){p.rl=0;const a=Math.atan2(q.y-p.y,q.x-p.x);G.ar.push({x:p.x,y:p.y,vx:Math.cos(a)*420,vy:Math.sin(a)*420,own:p,tg:q})}}
 G.ar=G.ar.filter(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;if(Math.hypot(a.x-a.tg.x,a.y-a.tg.y)<R+4){a.tg.hp-=15;a.tg.rl=0;return false}return a.x>0&&a.x<A&&a.y>0&&a.y<A});
 if(m.hp<=0||o.hp<=0)G.w=m.hp>o.hp?0:1}
function draw(s){x.clearRect(0,0,A,A);
 [[s.a,host?prof:G.o,'a'],[s.b,host?G.o:prof,'b']].forEach(([p,pr,k])=>{
  x.save();x.beginPath();x.arc(p.x,p.y,R,0,7);x.clip();const i=im(pr,k);
  if(i&&i.complete)x.drawImage(i,p.x-R,p.y-R,2*R,2*R);else{x.fillStyle=pr.c;x.fillRect(p.x-R,p.y-R,2*R,2*R)}x.restore();
  x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.arc(p.x,p.y,R,0,7);x.stroke();
  x.fillStyle='#fff';x.font='13px sans-serif';x.textAlign='center';x.fillText(pr.name+' '+W[pr.w].i,p.x,p.y-R-18);
  x.fillStyle='#600';x.fillRect(p.x-30,p.y-R-12,60,6);x.fillStyle='#4f4';x.fillRect(p.x-30,p.y-R-12,60*Math.max(0,p.hp)/500,6);
  x.fillStyle='#fff';x.fillText(Math.max(0,p.hp),p.x,p.y+R+14);
  if(pr.w!='bow'&&p.cd>0){x.fillStyle='#fa0';x.fillText('⏳'+p.cd.toFixed(1),p.x,p.y+R+28)}});
 x.fillStyle='#ff4';s.ar.forEach(a=>{x.beginPath();x.arc(a[0],a[1],4,0,7);x.fill()});
 if(s.ph=='aim'){x.fillStyle='#fff';x.font='24px sans-serif';x.fillText('Yön seç: '+Math.ceil(s.t),A/2,40);
  if(aim!=null){const b=host?s.a:s.b;x.strokeStyle='#ff4';x.beginPath();x.moveTo(b.x,b.y);x.lineTo(b.x+Math.cos(aim)*80,b.y+Math.sin(aim)*80);x.stroke()}}
 else $('info').textContent='Savaş!'}
function fin(o){const win=host?o==0:o==1;end(win,0)}
function end(win,dc){if(G.done)return;G.done=1;cancelAnimationFrame(raf);
 upd(d=>{d.g++;win?d.w++:d.l++});$('res').textContent=win?'SEN KAZANDIN 🏆':'KAYBETTİN 💀';
 if(host&&conn&&!G.bot){conn.send({t:'s',s:pack()})}
 setTimeout(()=>{if(peer)peer.destroy();G=null;gs=null;menu()},4000)}
if(localStorage.cbkMe&&U()[localStorage.cbkMe]){me=localStorage.cbkMe;menu()}
</script></body></html>
